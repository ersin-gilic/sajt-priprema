<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompletna Zbirka za FON | Dr Ersin Gilić</title>
    <!-- Onemogućavanje indeksiranja na Google-u kako stranica ne bi bila javna -->
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; user-select: none; }
        header { background-color: #003366; color: white; text-align: center; padding: 1rem; }
        .viewer-container { max-width: 1000px; margin: 1.5rem auto; height: 88vh; padding: 0 10px; }
        iframe { width: 100%; height: 100%; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 8px; }
    </style>
</head>
<!-- Onemogućen desni klik -->
<body oncontextmenu="return false;">

    <header>
        <h2 style="margin:0; font-size: 1.3rem;">🔒 Kompletna Zbirka – FON Beograd (Online Pregled)</h2>
        <p style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9;">Dr Ersin Gilić | Samo za ličnu upotrebu. Preuzimanje i umnožavanje je zabranjeno.</p>
    </header>

    <div class="viewer-container">
        <!-- PDF Viewer bez opcije preuzimanja i štampanja -->
        <iframe src="zbirka-fon-komplet.pdf#toolbar=0&navpanes=0&scrollbar=1"></iframe>
    </div>

    <script>
        // Onemogućavanje prečica za preuzimanje i štampanje (Ctrl+S, Ctrl+P)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u')) {
                e.preventDefault();
                alert('Preuzimanje i štampanje materijala je onemogućeno.');
            }
        });
    </script>
</body>
</html>
